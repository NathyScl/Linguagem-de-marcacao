<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>float</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>Float</h2>
    <p>Server para mudar a posição do elemento na tela,
        seguindo seu ancentral mais próximo.
    </p>
    <ul>
        <li>Float left; -> flutua para esquerda</li>
        <li>Float right; -> flutua para direita</li>
        <li>Float both; -> limpa os estilos anteriores</li>
        </ul>

        <br><br>
        <div>
            <h3>floa; left; </h3>
            <p class="esquerda">Um texto...</p>
            <img src="https://i.pinimg.com/736x/b2/08/71/b208719517ed6cd88c565fc8aaad78c6.jpg">
        </div>]
        <div>
            <h3>floa; right; </h3>
            <p class="direita">Um texto...</p>
            <img class="direita" src="https://i.pinimg.com/736x/b2/08/71/b208719517ed6cd88c565fc8aaad78c6.jpg">
        </div>
        <p class="limpar">Um twxto qualquer</p>
</body>
</html>
