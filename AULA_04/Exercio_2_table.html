<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo 2 - tabela</title>
</head>
<body>
    <table border="1" width="100%">
        <thead style="background-color: blue; color: #FFF">
            <tr>
                <th colspan="7" style="background-color: red; color: black">
                    Venha Morar em Nossos Belos Residenciais - Viver Serra
                </th>
            </tr>
        </thead>

        <tbody>
            <tr style="background-color: orange; color: black">
                <td colspan="3" style="background-color: yellow; color: black">
                    Apartamentos
                </td>
                <td colspan="1">Localização</td>
                <td>laranjeiras</td>
                <td>Manguinhos</td>
                <td>Vitoria</td>
            </tr>

            <tr style="background-color: yellow; color: black">
                <td>2 Quartos</td>
                <td>3 Quantos</td>
                <td>4 Quantos</td>
                <td colspan="4" style="background-color: orange; color: black">
                    Corretor On-Life
                </td>
            </tr>

            <tr style="background-color: orange; color: black">
                <td style="background-color: yellow; color: black">1 Suite</td>
                <td style="background-color: yellow; color: black">2 Suite</td>
                <td style="background-color: yellow; color: black">3 Suite</td>
                <td>3333-2333</td>
                <td>9999-9969</td>
                <td>8888-8868</td>
                <td>8111-1169</td>
            </tr>

            <tr style="background-color: yellow; color: black">
                <td>Lazer</td>
                <td colspan="2">Piscina, Salão de festas, Quadra</td>
                <td colspan="3" style="background-color: orange; color: black">
                    Pronto para morar
                </td>
                <td colspan="1" style="background-color: orange; color: black">
                    lançamento
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
